name: Build Arduino

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02  # v2.0.0

      - name: Initialize Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli core update-index
      
      - name: Set configs
        run: |
          cp ./src/Arduino/config_default.h ./src/Arduino/config.h
          cp ./src/Arduino/secret_default.h ./src/Arduino/secret.h
          cp ./src/ESP32/config_default.h ./src/ESP32/config.h
          cp ./src/ESP32/secret_default.h ./src/ESP32/secret.h

      - name: Compile
        run: |
          arduino-cli compile ./src/Arduino
          arduino-cli compile ./src/ESP32

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Static analysis (ESP32)
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,style,performance,portability \
            --language=c++ \
            --std=c++20 \
            --platform=unix32 \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=constParameterCallback:./src/ESP32/ESP32.ino \
            --error-exitcode=1 \
            -I ./src/ESP32 \
            ./src/ESP32/ESP32.ino ./src/ESP32/crypto.cpp ./src/ESP32/ota.cpp

      - name: Static analysis (Arduino)
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --language=c++ \
            --std=c++11 \
            --platform=avr8 \
            --inline-suppr \
            -D PROGMEM= \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -I ./src/Arduino \
            ./src/Arduino/Arduino.ino ./src/Arduino/sha256.cpp
