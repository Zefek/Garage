name: Deploy Garage on Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - Home
      serial_port:
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deployment:
    uses: Zefek/GithubActions/.github/workflows/arduino-build-deploy.yml@8e0333bd7deb714e7950d84629ee855731e37672
    with:
      environment: ${{ inputs.environment }}
      serial_port: ${{ inputs.serial_port }}
      device_name: Garage
      source_dir: "./src/Arduino"
    secrets: inherit
